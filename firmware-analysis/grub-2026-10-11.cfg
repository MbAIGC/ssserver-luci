serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1 --rtscts=off
terminal_input console serial; terminal_output console serial

set default="0"
set timeout="0"
search -l kernel -s root

menuentry "LEDE" {
	linux /boot/vmlinuz root=PARTUUID=3efc5612-c26a-90ae-3057-5fb5c7888302 rootwait  console=tty0 console=ttyS0,115200n8 noinitrd swiotlb=65536
}
menuentry "LEDE (failsafe)" {
	linux /boot/vmlinuz failsafe=true root=PARTUUID=3efc5612-c26a-90ae-3057-5fb5c7888302 rootwait  console=tty0 console=ttyS0,115200n8 noinitrd
}
