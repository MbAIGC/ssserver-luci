serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1 --rtscts=off
terminal_input console serial; terminal_output console serial

set default="0"
set timeout="0"
search -l kernel -s root

menuentry "LEDE" {
	linux /boot/vmlinuz root=PARTUUID=a09fa0ee-8410-22ef-bc2d-11e18a98ef02 rootwait  console=tty0 console=ttyS0,115200n8 noinitrd swiotlb=65536
}
menuentry "LEDE (failsafe)" {
	linux /boot/vmlinuz failsafe=true root=PARTUUID=a09fa0ee-8410-22ef-bc2d-11e18a98ef02 rootwait  console=tty0 console=ttyS0,115200n8 noinitrd
}
