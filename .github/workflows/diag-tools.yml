name: Diagnose tools build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bc bison build-essential ccache cpio file flex \
            g++ gawk gettext git gperf libelf-dev libncurses-dev libssl-dev \
            libtool-bin pkg-config python3 python3-dev python3-setuptools \
            rsync subversion swig time unzip wget xsltproc zlib1g-dev zstd \
            liblz4-dev liblzma-dev uuid-dev libselinux1-dev
          # 记录环境版本，便于比对
          gcc --version | head -1
          ldd --version | head -1
          autoconf --version | head -1
          automake --version | head -1

      - name: Fetch Lean
        run: |
          set -eux
          git init openwrt && cd openwrt
          git remote add origin https://github.com/coolsnowwolf/lede.git
          git fetch --depth 1 origin master
          git checkout --detach FETCH_HEAD
          git rev-parse HEAD > /tmp/lean_sha

      - name: Configure minimal
        run: |
          set -eux
          cd openwrt
          { echo 'CONFIG_TARGET_x86=y'; echo 'CONFIG_TARGET_x86_64=y'; echo 'CONFIG_TARGET_DEVICE_x86_64_DEVICE_generic=y'; } > .config
          make defconfig

      - name: Build erofs-utils verbose
        run: |
          set -eux
          cd openwrt
          make tools/erofs-utils/compile V=s -j1 2>&1 | tail -150 || {
            echo "===== EROFS 构建失败，以下为完整日志 ====="
            exit 1
          }
