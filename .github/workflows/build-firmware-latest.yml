name: Build OpenWrt x86-64 firmware (Lean)

on:
  # 1) 手动触发（Actions 页面 Run workflow / gh workflow run）
  workflow_dispatch:
  # 2) 每周五 UTC 12:00 = 北京时间周五 20:00
  schedule:
    - cron: '0 12 * * 5'

permissions:
  contents: write

concurrency:
  group: firmware-build-latest
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  SOURCE_REPO: https://github.com/coolsnowwolf/lede.git
  SOURCE_REF: master
  CONFIG_FILE: firmware-build/config.turboacc
  FEEDS_FILE: firmware-build/feeds-latest.conf

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: firmware-build-latest
          fetch-depth: 1

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          build_date="$(date +%y.%-m.%-d)"
          echo "build_date=$build_date" >> "$GITHUB_OUTPUT"
          echo "tag=LEDE-R${build_date}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          set -eux
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/share/swift \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bc bison build-essential ccache cpio file flex \
            g++ gawk gettext git gperf libelf-dev libncurses-dev libssl-dev \
            libtool-bin pkg-config python3 python3-dev python3-setuptools \
            rsync subversion swig time unzip wget xsltproc zlib1g-dev zstd

      - name: Fetch Lean source
        id: src
        run: |
          set -eux
          git init openwrt
          cd openwrt
          git remote add origin "$SOURCE_REPO"
          git fetch --depth 1 origin "$SOURCE_REF"
          git checkout --detach FETCH_HEAD
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git log -1 --format='%H %cd %s' --date=iso
          grep -E 'KERNEL_PATCHVER|KERNEL_TESTING_PATCHVER' target/linux/x86/Makefile

      - name: Prepare feeds
        run: |
          set -eux
          cd openwrt
          cp "$GITHUB_WORKSPACE/$FEEDS_FILE" feeds.conf
          cat feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add local packages
        run: |
          set -eux
          cd openwrt
          mkdir -p package/ssserver-luci package/luci-app-ddns-go package/luci-app-turboacc
          cp -a "$GITHUB_WORKSPACE/ssserver-luci/." package/ssserver-luci/
          cp -a "$GITHUB_WORKSPACE/luci-app-ddns-go/." package/luci-app-ddns-go/
          cp -a "$GITHUB_WORKSPACE/firmware-build/local-packages/luci-app-turboacc/." package/luci-app-turboacc/
          sed -i 's#^include ../../luci.mk#include $(TOPDIR)/feeds/luci/luci.mk#' package/luci-app-turboacc/Makefile
          sed -i 's#^PKG_RELEASE:=.*#PKG_RELEASE:=1#' package/luci-app-turboacc/Makefile
          find package/luci-app-turboacc -type f | sort

      - name: Configure
        run: |
          set -eux
          cd openwrt
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
          for opt in \
            CONFIG_PACKAGE_luci-compat=y \
            CONFIG_PACKAGE_ddns-go=y \
            CONFIG_PACKAGE_ssserver-luci=y \
            CONFIG_PACKAGE_luci-app-ddns-go=y \
            CONFIG_PACKAGE_kmod-wireguard=y \
            CONFIG_PACKAGE_kmod-udptunnel4=y \
            CONFIG_PACKAGE_kmod-udptunnel6=y \
            CONFIG_PACKAGE_wireguard-tools=y \
            CONFIG_PACKAGE_luci-proto-wireguard=y \
            CONFIG_PACKAGE_luci-app-turboacc=y \
            CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_OFFLOADING=y \
            CONFIG_PACKAGE_kmod-nft-offload=y
          do
            grep -qxF "$opt" .config || echo "$opt" >> .config
          done
          make defconfig
          echo '== flags =='
          grep -E 'CONFIG_PACKAGE_(luci-app-turboacc|kmod-nft-offload|kmod-wireguard|wireguard-tools|luci-proto-wireguard|ssserver-luci|luci-app-ddns-go|luci-app-passwall|luci-app-openclash)=' .config || true

      - name: Download sources
        run: |
          set -eux
          cd openwrt
          make download -j8

      - name: Build firmware
        run: |
          set -eux
          cd openwrt
          make -j"$(nproc)" V=s

      - name: Collect artifacts
        if: always()
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp -v openwrt/bin/targets/x86/64/*combined-efi.img.gz \
            "$GITHUB_WORKSPACE/artifacts/lede-x86-64-generic-squashfs-combined-efi.img.gz"
          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          IMG_NAME="lede-x86-64-generic-squashfs-combined-efi.img.gz"
          IMG="$GITHUB_WORKSPACE/artifacts/$IMG_NAME"
          SHA="$(sha256sum "$IMG" | cut -d' ' -f1)"
          SIZE="$(du -h "$IMG" | cut -f1)"
          MANIFEST="$(ls "$GITHUB_WORKSPACE"/openwrt/bin/targets/x86/64/*.manifest | head -n1)"
          COUNT="$(wc -l < "$MANIFEST")"
          TAG="${{ steps.ver.outputs.tag }}"
          NOTES="$RUNNER_TEMP/notes.md"
          {
            echo "Lean LEDE x86-64 固件"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 源码 | \`coolsnowwolf/lede@${{ steps.src.outputs.sha }}\` |"
            echo "| 内核 | 6.18 LTS |"
            echo "| 包数 | ${COUNT} |"
            echo "| 大小 | ${SIZE} |"
            echo "| SHA256 | \`${SHA}\` |"
            echo
            echo "含：WireGuard、SS Server、DDNS-GO、Passwall、OpenClash、TurboACC"
            echo
            echo '磁盘格式：GPT，p1 FAT16（内核/GRUB）+ p2 SquashFS 根 + 首次启动创建 ext4 overlay'
            echo
            echo '刷机：`gunzip -c *.img.gz > fw.img && dd if=fw.img of=/dev/sdX bs=4M conv=fsync`'
            echo
            echo '首次启动：LAN `192.168.1.253`，root 密码 `password`，请立即修改。'
          } > "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r a; do
              [ -z "$a" ] && continue
              [ "$a" = "$IMG_NAME" ] || gh release delete-asset "$TAG" "$a" -y
            done
            gh release upload "$TAG" "$IMG" --clobber
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES" --latest "$IMG"
          fi
          echo "released: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.ver.outputs.tag }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
