name: Build OpenWrt x86-64 firmware

on:
  workflow_dispatch:
  push:
    branches:
      - firmware-build
    paths:
      - '.github/workflows/build-firmware.yml'
      - 'firmware-build/**'
      - 'ssserver-luci/**'
      - 'luci-app-ddns-go/**'

permissions:
  contents: read

concurrency:
  group: firmware-build-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_REPO: https://github.com/coolsnowwolf/lede.git
  SOURCE_COMMIT: 27d57f45e01459e0d498efbf44532bfe0dfc1d40
  CONFIG_FILE: firmware-build/config.buildinfo
  FEEDS_FILE: firmware-build/feeds.conf

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          set -eux
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/share/swift \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bc bison build-essential ccache cpio file flex \
            g++ gawk gettext git gperf libelf-dev libncurses-dev libssl-dev \
            libtool-bin pkg-config python3 python3-dev python3-setuptools \
            rsync subversion swig time unzip wget xsltproc zlib1g-dev zstd

      - name: Fetch Lean LEDE source
        run: |
          set -eux
          git init openwrt
          cd openwrt
          git remote add origin "$SOURCE_REPO"
          git fetch --depth 1 origin "$SOURCE_COMMIT"
          git checkout --detach FETCH_HEAD
          git log -1 --format='%H %cd %s' --date=iso

      - name: Prepare feeds
        run: |
          set -eux
          cd openwrt
          cp "$GITHUB_WORKSPACE/$FEEDS_FILE" feeds.conf
          cat feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add local packages
        run: |
          set -eux
          cd openwrt
          mkdir -p package/ssserver-luci package/luci-app-ddns-go
          cp -a "$GITHUB_WORKSPACE/ssserver-luci/." package/ssserver-luci/
          cp -a "$GITHUB_WORKSPACE/luci-app-ddns-go/." package/luci-app-ddns-go/
          find package/ssserver-luci package/luci-app-ddns-go -maxdepth 2 -type f | sort

      - name: Configure
        run: |
          set -eux
          cd openwrt
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
          for opt in \
            CONFIG_PACKAGE_luci-compat=y \
            CONFIG_PACKAGE_ddns-go=y \
            CONFIG_PACKAGE_ssserver-luci=y \
            CONFIG_PACKAGE_luci-app-ddns-go=y \
            CONFIG_PACKAGE_kmod-wireguard=y \
            CONFIG_PACKAGE_kmod-udptunnel4=y \
            CONFIG_PACKAGE_kmod-udptunnel6=y \
            CONFIG_PACKAGE_wireguard-tools=y \
            CONFIG_PACKAGE_luci-proto-wireguard=y
          do
            grep -qxF "$opt" .config || echo "$opt" >> .config
          done
          make defconfig
          ./scripts/diffconfig.sh > "$GITHUB_WORKSPACE/firmware-build/config.actual.diffconfig" || true
          cp .config "$GITHUB_WORKSPACE/firmware-build/config.actual"
          echo '== requested package flags =='
          grep -E 'CONFIG_PACKAGE_(ssserver-luci|luci-app-ddns-go|ddns-go|kmod-wireguard|wireguard-tools|luci-proto-wireguard|luci-app-passwall|luci-app-openclash)=' .config || true
          echo '== target =='
          grep -E 'CONFIG_TARGET_(x86|DEVICE|ROOTFS|KERNEL|IMAGES)|CONFIG_GRUB' .config | head -30

      - name: Download sources
        run: |
          set -eux
          cd openwrt
          make download -j8

      - name: Build firmware
        run: |
          set -eux
          cd openwrt
          make -j"$(nproc)" V=s

      - name: Collect artifacts
        if: always()
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp -v openwrt/bin/targets/x86/64/*combined-efi.img.gz "$GITHUB_WORKSPACE/artifacts/" || true
          cp -v openwrt/bin/targets/x86/64/*combined-efi.img.gz.sha256 "$GITHUB_WORKSPACE/artifacts/" || true
          cp -v openwrt/bin/targets/x86/64/*.manifest "$GITHUB_WORKSPACE/artifacts/" || true
          cp -v openwrt/.config "$GITHUB_WORKSPACE/artifacts/config.actual" || true
          cp -v "$GITHUB_WORKSPACE/firmware-build/config.actual.diffconfig" "$GITHUB_WORKSPACE/artifacts/" || true
          ls -lh "$GITHUB_WORKSPACE/artifacts" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86-64-firmware
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
