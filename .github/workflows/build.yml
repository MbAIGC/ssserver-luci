name: build

on:
  push:
    branches: [ main, master ]
    tags: [ '*-v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_VERSION: "24.10.5"
  SDK_URL: "https://downloads.openwrt.org/releases/24.10.5/targets/x86/64/openwrt-sdk-24.10.5-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
  ALL_PKG_DIRS: "ssserver-luci luci-app-ddns-go"

jobs:
  # 决定这次构建哪些包、要不要发 Release
  # tag 形如 <PKG_NAME>-v<PKG_VERSION> 时才发布，且只发布该包
  meta:
    runs-on: ubuntu-24.04
    outputs:
      build_dirs: ${{ steps.m.outputs.build_dirs }}
      release_pkg: ${{ steps.m.outputs.release_pkg }}
      release_title: ${{ steps.m.outputs.release_title }}
      release_tag: ${{ steps.m.outputs.release_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve target packages
        id: m
        run: |
          set -euo pipefail

          tag=""
          case "$GITHUB_REF" in
            refs/tags/*) tag="${GITHUB_REF#refs/tags/}" ;;
          esac

          tagged_pkg=""
          title=""

          if [ -n "$tag" ]; then
            for d in $ALL_PKG_DIRS; do
              name=$(sed -n 's/^PKG_NAME:=//p' "$d/Makefile")
              ver=$(sed -n 's/^PKG_VERSION:=//p' "$d/Makefile")
              rel=$(sed -n 's/^PKG_RELEASE:=//p' "$d/Makefile")

              if [ "$tag" = "${name}-v${ver}" ] || [ "$tag" = "${name}-v${ver}-r${rel}" ]; then
                tagged_pkg="$d"
                title="${name} ${ver}"
              fi
            done
          fi

          if [ -n "$tagged_pkg" ]; then
            build_dirs="$tagged_pkg"
          else
            build_dirs="$ALL_PKG_DIRS"
          fi

          {
            echo "build_dirs=$build_dirs"
            echo "release_pkg=$tagged_pkg"
            echo "release_title=$title"
            echo "release_tag=$tag"
          } >> "$GITHUB_OUTPUT"

          echo "tag='$tag' build_dirs='$build_dirs' release_pkg='$tagged_pkg'"

  ipk:
    needs: meta
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libncurses-dev zlib1g-dev gawk git gettext \
            libssl-dev xsltproc rsync wget unzip zstd python3 lua5.1

      - name: Lint sources
        run: sh tools/lint.sh

      - name: Cache SDK tarball
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdk.tar.zst
          key: openwrt-sdk-${{ env.SDK_VERSION }}-x86-64-v1

      - name: Fetch SDK
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/sdk.tar.zst" ]; then
            curl -fL --retry 3 -o "$RUNNER_TEMP/sdk.tar.zst" "$SDK_URL"
          fi
          mkdir -p "$RUNNER_TEMP/sdk"
          tar --use-compress-program=unzstd -xf "$RUNNER_TEMP/sdk.tar.zst" -C "$RUNNER_TEMP/sdk"
          ls -d "$RUNNER_TEMP"/sdk/openwrt-sdk-*

      - name: Build packages
        env:
          PKG_DIRS: ${{ needs.meta.outputs.build_dirs }}
        run: |
          set -euo pipefail
          SDK="$(echo "$RUNNER_TEMP"/sdk/openwrt-sdk-*)"

          for d in $PKG_DIRS; do
            DEST="$SDK/package/$d"
            rm -rf "$DEST"
            mkdir -p "$DEST"
            tar -cf - --exclude=.git -C "$d" . | tar -xf - -C "$DEST"
            echo "== staged $d"
          done

          cd "$SDK"
          make defconfig

          for d in $PKG_DIRS; do
            echo "== build $d"
            make "package/$d/compile" V=s -j"$(nproc)"
          done

          mkdir -p "$GITHUB_WORKSPACE/dist"
          for d in $PKG_DIRS; do
            cp bin/packages/*/*/"$d"_*.ipk "$GITHUB_WORKSPACE/dist/"
          done
          ls -l "$GITHUB_WORKSPACE/dist"

      - name: Smoke test ipk contents
        run: |
          set -euo pipefail

          check() {
            ipk="$1"; shift
            echo "== $ipk"
            tar xzOf "$ipk" ./data.tar.gz | tar tz | sort > files.txt
            cat files.txt
            for need in "$@"; do
              grep -qxF "$need" files.txt || { echo "缺少文件: $need"; exit 1; }
            done
            echo -n "   Depends: "
            tar xzOf "$ipk" ./control.tar.gz | tar xzO ./control | sed -n 's/^Depends: //p'
          }

          for ipk in dist/*.ipk; do
            case "$(basename "$ipk")" in
              ssserver-luci_*)
                check "$ipk" \
                  "./etc/init.d/ssserver" \
                  "./etc/config/ssserver" \
                  "./etc/uci-defaults/90-ssserver-luci" \
                  "./usr/lib/lua/luci/controller/ssserver.lua" \
                  "./usr/lib/lua/luci/model/cbi/ssserver/settings.lua" \
                  "./usr/lib/lua/luci/model/cbi/ssserver/advanced.lua" \
                  "./usr/lib/lua/luci/view/ssserver/overview.htm"
                ;;
              luci-app-ddns-go_*)
                check "$ipk" \
                  "./etc/uci-defaults/99-luci-ddns-go" \
                  "./usr/lib/lua/luci/controller/ddns_go.lua" \
                  "./usr/lib/lua/luci/model/cbi/ddns_go/config.lua" \
                  "./usr/lib/lua/luci/view/ddns_go/panel.htm" \
                  "./usr/lib/lua/luci/view/ddns_go/log.htm"
                ;;
            esac
          done

      - name: Upload ipk
        uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: dist/*.ipk
          if-no-files-found: error
          retention-days: 30

  # 只有 tag 匹配 <PKG_NAME>-v<PKG_VERSION> 时才发布，Release 名称用插件自己的版本
  release:
    if: needs.meta.outputs.release_pkg != ''
    needs: [ meta, ipk ]
    runs-on: ubuntu-24.04

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show
        run: ls -l dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.meta.outputs.release_title }}
          tag_name: ${{ needs.meta.outputs.release_tag }}
          files: dist/${{ needs.meta.outputs.release_pkg }}_*.ipk
          generate_release_notes: true
