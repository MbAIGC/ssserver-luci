name: Build ddns-go ipk (Lean backend + sirpdboy LuCI)

on:
  workflow_dispatch:
  schedule:
    # 每周五 UTC 13:00 = 北京时间周五 21:00（比固件构建晚 1 小时）
    - cron: '0 13 * * 5'

permissions:
  contents: write

concurrency:
  group: build-ddns-go-ipk
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  LEAN_REPO: https://github.com/coolsnowwolf/lede.git
  LEAN_REF: master
  SIRPDBOY_REF: main

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          d="$(date +%y.%-m.%-d)"
          echo "tag=ddns-go-ipk-R${d}" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio file flex g++ gawk gettext git \
            gperf libelf-dev libncurses-dev libssl-dev libtool-bin pkg-config \
            python3 python3-dev python3-setuptools rsync subversion swig time \
            unzip wget xsltproc zlib1g-dev zstd \
            liblz4-dev liblzma-dev uuid-dev libselinux1-dev

      - name: Fetch Lean source
        id: lean
        run: |
          set -eux
          git init openwrt
          cd openwrt
          git remote add origin "$LEAN_REPO"
          git fetch --depth 1 origin "$LEAN_REF"
          git checkout --detach FETCH_HEAD
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Lean: $sha $(git log -1 --format='%cd %s' --date=iso)"

      - name: Prepare feeds
        run: |
          set -eux
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply mix (Lean backend + sirpdboy LuCI)
        id: mix
        run: |
          set -eux
          cd openwrt
          "$GITHUB_WORKSPACE/ddns-go-lean-sirpdboy-mix/apply.sh" --upstream "$PWD"
          echo '== .mix-info =='
          cat .mix-info
          grep -E '^SIRPDBOY_SHA=' .mix-info >> "$GITHUB_OUTPUT"
          grep -E '^LUCI_APP_VERSION=' .mix-info >> "$GITHUB_OUTPUT"

      - name: Configure
        run: |
          set -eux
          cd openwrt
          {
            echo 'CONFIG_TARGET_x86=y'
            echo 'CONFIG_TARGET_x86_64=y'
            echo 'CONFIG_TARGET_DEVICE_x86_64_DEVICE_generic=y'
            echo 'CONFIG_PACKAGE_ddns-go=y'
            echo 'CONFIG_PACKAGE_luci-app-ddns-go=y'
            echo 'CONFIG_PACKAGE_luci-i18n-ddns-go-zh-cn=y'
          } > .config
          make defconfig
          echo '== 选中项 =='
          grep -E 'CONFIG_PACKAGE_(ddns-go|luci-app-ddns-go|luci-i18n-ddns-go-zh-cn)=' .config

      - name: Speed up download (mirror first)
        run: |
          set -eux
          "$GITHUB_WORKSPACE/firmware-build/speed-up-download.sh" openwrt

      - name: Prepare toolchain
        run: |
          set -eux
          cd openwrt
          # 只编包也必须先把 tools / toolchain 装好，否则 package/libs/toolchain
          # 在安装 libc 时会因为 staging_dir 里没有 ld-musl-*.so* 而失败
          # tools 并行编译存在偶发时序问题（elfutils 单独编能过），失败后单编 + 重试
          ok=0
          for attempt in 1 2 3; do
            echo "== tools/install 第 ${attempt} 次尝试"
            if make tools/install -j"$(nproc)"; then ok=1; break; fi
            echo "== 失败，单线程补编 elfutils 后重试（已完成的目标会自动跳过）"
            make tools/elfutils/compile V=s -j1 2>&1 | tail -40 || true
          done
          [ "${ok}" = "1" ] || { echo "tools/install 连续 3 次失败" >&2; exit 1; }
          make toolchain/install -j"$(nproc)"

      - name: Build packages
        run: |
          set -eux
          cd openwrt
          make package/ddns-go/compile V=s -j"$(nproc)"
          make package/luci-app-ddns-go/compile V=s -j"$(nproc)"

      - name: Collect ipk
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find openwrt/bin/packages -name 'ddns-go_*.ipk' \
            -o -name 'luci-app-ddns-go_*.ipk' \
            -o -name 'luci-i18n-ddns-go-zh-cn_*.ipk' \
            | sort | tee /tmp/found.txt
          while read -r f; do cp -v "$f" "$GITHUB_WORKSPACE/dist/"; done < /tmp/found.txt
          # 三个都必须有
          for pat in 'ddns-go_' 'luci-app-ddns-go_' 'luci-i18n-ddns-go-zh-cn_'; do
            ls "$GITHUB_WORKSPACE/dist/${pat}"*.ipk >/dev/null 2>&1 || {
              echo "缺少产物: ${pat}*.ipk" >&2
              exit 1
            }
          done
          echo '== dist =='
          ls -lh "$GITHUB_WORKSPACE/dist"
          sha256sum "$GITHUB_WORKSPACE/dist"/*.ipk | tee "$GITHUB_WORKSPACE/dist/SHA256SUMS"

      - name: Note
        run: |
          echo "== 本 workflow 只做快速验证，ipk 以 artifact 形式提供"
          echo "== 正式发布请用固件构建（LEDE-ipk-R<日期>）"
          ls -lh dist

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddns-go-ipk
          path: dist/
          if-no-files-found: warn
          retention-days: 14
