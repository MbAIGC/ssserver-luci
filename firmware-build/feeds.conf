# Lean LEDE feeds, matching the 2026-10-11 image source commit
# (coolsnowwolf/lede @ 27d57f45e01459e0d498efbf44532bfe0dfc1d40).
# The first five lines are the repo's feeds.conf.default at that commit.
src-git packages https://github.com/coolsnowwolf/packages.git
src-git luci https://github.com/coolsnowwolf/luci.git;openwrt-25.12
src-git routing https://github.com/coolsnowwolf/routing.git
src-git telephony https://github.com/coolsnowwolf/telephony.git
src-git helloworld https://github.com/fw876/helloworld.git

# Passwall + its binary packages are not in Lean's default feeds, but the
# 2026-10-11 image contains luci-app-passwall / sing-box / shadowsocks-rust.
src-git passwall https://github.com/xiaorouji/openwrt-passwall.git
src-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages.git
